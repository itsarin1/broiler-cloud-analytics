name: Kandang Ayam - Analytics Terintegrasi
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: kandang-analytics
  cancel-in-progress: false
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run analytics
        env:
          BLYNK_TOKEN: ${{ secrets.BLYNK_TOKEN }}
          BLYNK_BASE_URL: ${{ vars.BLYNK_BASE_URL }}
          FEED_TARGET_G_PER_BIRD: ${{ vars.FEED_TARGET_G_PER_BIRD }}
          TRACKING_FROM_DAY_1: ${{ vars.TRACKING_FROM_DAY_1 }}
          START_WEIGHT_G: ${{ vars.START_WEIGHT_G }}
        run: python analytics.py
      - name: Persist log and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-update IoT broiler analytics'
            git push
          fi
